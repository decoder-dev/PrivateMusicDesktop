[package]
name = "private-music-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Private Music for the desktop: an unofficial VK Music player."
default-run = "private-music-desktop"

[lib]
name = "private_music_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pm_engine = { path = "../engine" }
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
url = "2"
tauri-plugin-media-session = { path = "../plugins/media-session" }
# Android sign-in (a stub elsewhere). Its commands are never granted to the webview.
tauri-plugin-vk-login = { path = "../plugins/vk-login", features = ["engine"] }

# Desktop only: tray, media keys, single instance and window state have no
# meaning (or no implementation) on Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
sys-locale = "0.3"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2"] }

[dev-dependencies]
tempfile = "3"
