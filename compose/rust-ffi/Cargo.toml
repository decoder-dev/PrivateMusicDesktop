[package]
name = "private-music-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "private_music_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pm-engine = { path = "../../engine", package = "pm-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[workspace]
