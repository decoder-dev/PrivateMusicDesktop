[package]
name = "pm_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Private Music desktop engine: VK client, HLS fetching, decoding and playback."

[dependencies]
pm_native = { path = "../../native/pm-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "blocking"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "isomp4"] }
cpal = "0.15"
ringbuf = "0.4"
rubato = "0.16"
rand = "0.8"
log = "0.4"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
