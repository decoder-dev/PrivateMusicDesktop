[workspace]
members = ["engine", "src-tauri"]
# The vendored iOS crate is a dependency, not part of this workspace (it has its
# own, with panic=abort): keep it out of `--workspace` runs such as clippy.
exclude = ["native"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"

# pm_native is built for iOS with panic=abort; the desktop app keeps unwinding
# so a bad packet in one track cannot take the whole process down silently.
