name: Compose Multiplatform

on:
  push:
    branches: ["main"]
    paths:
      - "compose/**"
      - "engine/**"
      - "native/**"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "compose/**"
      - "engine/**"
      - "native/**"
      - ".github/workflows/compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust FFI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Build native engine
        run: cargo build --manifest-path compose/rust-ffi/Cargo.toml

  ui:
    name: Compose UI tests and screenshots
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Run shared and rendering tests
        working-directory: compose
        run: gradle --no-daemon :composeApp:desktopTest
      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-test-results
          path: compose/composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: ignore
      - name: Upload Compose screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-screenshots
          path: compose/composeApp/build/screenshots/*.png
          if-no-files-found: error

  android:
    name: Compose Android APK (${{ matrix.abi }})
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android }
          - { abi: x86_64, target: x86_64-linux-android }
    env:
      NDK_VERSION: 27.2.12479018
      ABI: ${{ matrix.abi }}
      RUST_TARGET: ${{ matrix.target }}
      SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
      PM_OUT: ${{ github.workspace }}/compose-emulator-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Android SDK, NDK and Rust target
        run: |
          set -euxo pipefail
          . scripts/android-ci-env.sh
          scripts/android-ci-sdk.sh "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
          rustup target add "$RUST_TARGET"
      - name: Build APK with Rust JNI library
        run: |
          . scripts/android-ci-env.sh >/dev/null
          if [ "$ABI" = x86_64 ]; then
            export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
            export CXX_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang++"
            export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
            export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CC_x86_64_linux_android"
          fi
          cd compose
          gradle --no-daemon :androidApp:assembleDebug "-Dpm.rust.abi=$ABI"
      - name: Verify Rust JNI library is packaged
        run: unzip -l compose/androidApp/build/outputs/apk/debug/androidApp-debug.apk | grep -F "lib/$ABI/libprivate_music_engine.so"
      - name: Verify media service and permissions in APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml compose/androidApp/build/outputs/apk/debug/androidApp-debug.apk > compose/androidApp/build/outputs/apk/debug/manifest.txt
          grep -q 'PlaybackService' compose/androidApp/build/outputs/apk/debug/manifest.txt || { echo 'PlaybackService is missing'; exit 1; }
          grep -q 'POST_NOTIFICATIONS' compose/androidApp/build/outputs/apk/debug/manifest.txt || { echo 'Notification permission is missing'; exit 1; }
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' compose/androidApp/build/outputs/apk/debug/manifest.txt || { echo 'Media playback foreground permission is missing'; exit 1; }
          # aapt2 prints the enum as its native bit mask (FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK = 1 << 4).
          grep -Eq 'foregroundServiceType.*0x0*10' compose/androidApp/build/outputs/apk/debug/manifest.txt || { echo 'mediaPlayback service type is missing'; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-android-debug-${{ matrix.abi }}
          path: compose/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Boot test emulator
        if: matrix.abi == 'x86_64'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          . scripts/android-ci-env.sh
          scripts/android-ci-sdk.sh emulator platform-tools "$SYSTEM_IMAGE"
          scripts/android-emulator-pin.sh
          scripts/android-emulator-tests/boot-emulator.sh
      - name: Install, launch and play offline on Android
        if: matrix.abi == 'x86_64'
        timeout-minutes: 5
        run: python3 scripts/compose-android-smoke.py compose/androidApp/build/outputs/apk/debug/androidApp-debug.apk "$PM_OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.abi == 'x86_64'
        with:
          name: compose-android-emulator
          path: compose-emulator-out/
          if-no-files-found: ignore
