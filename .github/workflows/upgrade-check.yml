name: Upgrade check

# Устанавливает опубликованный выпуск, затем поверх него другой установщик и проверяет, сохранились ли
# данные входа и данные приложения. Запустите его вручную на любых двух выпусках.
on:
  workflow_dispatch:
    inputs:
      old:
        description: Release tag installed first
        required: true
        default: v0.2.3
      new:
        description: Release tag installed over it
        required: true
        default: v0.2.3

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download both installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ inputs.old }}' --repo '${{ github.repository }}' --pattern '*-setup.exe' --dir "$env:RUNNER_TEMP\old"
          gh release download '${{ inputs.new }}' --repo '${{ github.repository }}' --pattern '*-setup.exe' --dir "$env:RUNNER_TEMP\new"

      - name: Install, then install over it
        shell: pwsh
        run: |
          $old = (Get-ChildItem "$env:RUNNER_TEMP\old\*-setup.exe").FullName
          $new = (Get-ChildItem "$env:RUNNER_TEMP\new\*-setup.exe").FullName
          scripts\upgrade-check.ps1 -Old $old -New $new
