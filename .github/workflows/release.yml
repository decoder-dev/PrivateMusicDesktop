name: Release

# Builds the installers and publishes them as a GitHub release, either from a
# pushed tag (v0.2.0) or by running the workflow by hand with the tag name:
# then the tag is created on the commit the run is for.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must match the version in tauri.conf.json), e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          declared=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ] || [ "$version" != "$cargo_version" ]; then
            echo "Tag $tag, tauri.conf.json $declared, Cargo.toml $cargo_version must agree." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, bundles: "deb appimage", target: "" }
          - { name: Windows, os: windows-latest, bundles: "nsis", target: "" }
          - { name: macOS, os: macos-latest, bundles: "dmg", target: "universal-apple-darwin" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        shell: bash
        working-directory: src-tauri
        # The npm package ships a prebuilt CLI: no ten-minute `cargo install`.
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # The VK sign-in window must load on every system, from the real build.
      - name: Sign-in window loads (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=$(find target -path '*release/bundle/macos/*.app/Contents/MacOS/private-music-desktop' -print -quit)
          [ -n "$binary" ] || binary=target/${{ matrix.target }}/release/private-music-desktop
          scripts/smoke-login.sh "$binary"

      - name: Sign-in window loads (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $env:PM_SMOKE_LOGIN = $report
          $app = Start-Process -FilePath 'target\release\private-music-desktop.exe' -PassThru
          if (-not $app.WaitForExit(150000)) { $app.Kill(); Write-Host 'the app did not finish in time' }
          Write-Host "app exited with $($app.ExitCode)"
          if (Test-Path $report) { Get-Content $report } else { Write-Host '(no report)' }
          $log = Join-Path $env:LOCALAPPDATA 'com.dec.privatemusic2.desktop\logs\private-music.log'
          if (Test-Path $log) { Write-Host "--- $log"; Get-Content $log }
          if (-not ((Test-Path $report) -and (Select-String -Path $report -Pattern '^loaded ' -Quiet))) { exit 1 }

      - name: Fixed window presets and fullscreen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts\smoke-window.ps1 -Binary 'target\release\private-music-desktop.exe'

      # An update installs over the old version and must keep the sign-in and data.
      - name: Installing over the last release keeps the sign-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $new = (Get-ChildItem 'target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1).FullName
          gh release download --repo '${{ github.repository }}' --pattern '*-setup.exe' --dir "$env:RUNNER_TEMP\previous"
          $previous = Get-ChildItem "$env:RUNNER_TEMP\previous\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($previous) { $old = $previous.FullName } else {
            Write-Host '::notice::No earlier release exists: installing the new build over itself instead.'
            $old = $new
          }
          scripts\upgrade-check.ps1 -Old $old -New $new

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the installers built above
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$REPO" --pattern 'installers-*' --dir parts

      - name: Give the files plain names and checksum them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir out
          find parts -type f | while read -r file; do
            case "$file" in
              *-setup.exe)  name="PrivateMusic_${VERSION}_windows-x64-setup.exe" ;;
              *.dmg)        name="PrivateMusic_${VERSION}_macos-universal.dmg" ;;
              *.deb)        name="PrivateMusic_${VERSION}_linux-amd64.deb" ;;
              *.AppImage)   name="PrivateMusic_${VERSION}_linux-amd64.AppImage" ;;
              *) continue ;;
            esac
            cp "$file" "out/$name"
          done
          cd out
          ls -l
          [ "$(ls | wc -l)" -eq 4 ] || { echo "expected four installers" >&2; exit 1; }
          sha256sum * > SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" out/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "Private Music ${TAG#v}" \
            --notes "Unofficial VK Music player for Windows, macOS and Linux. Installers are not code-signed: use the install scripts in the README, or see the notes there for the first-run warning."
