name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "compose/settings.gradle.kts"
      - "compose/composeApp/build.gradle.kts"
      - "compose/androidApp/build.gradle.kts"
      - ".github/workflows/release.yml"
      - "docs/releases/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing. Defaults to the Compose package version."
        required: false

concurrency:
  group: compose-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  validate:
    name: Validate Compose release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*packageVersion = "([^"]+)"$/\1/p' compose/composeApp/build.gradle.kts)
          android_version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' compose/androidApp/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$android_version" == "$version" ]]
          [[ -z "$VERSION" || "$VERSION" == "v$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.artifact }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: windows-x64, extension: msi }
          - { os: ubuntu-24.04, artifact: linux-amd64, extension: deb }
          - { os: macos-15-intel, artifact: macos-x64, extension: dmg }
          - { os: macos-15, artifact: macos-arm64, extension: dmg }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Linux native and packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config fakeroot
      - name: Build desktop package with Rust resource
        working-directory: compose
        run: gradle --no-daemon :composeApp:packageDistributionForCurrentOS
      - name: Collect and name package
        shell: bash
        env:
          EXTENSION: ${{ matrix.extension }}
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package=$(find compose/composeApp/build/compose/binaries -type f -name "*.${EXTENSION}" | head -1)
          [ -n "$package" ]
          mkdir -p dist
          cp "$package" "dist/PrivateMusic_${VERSION}_${ARTIFACT}.${EXTENSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-v1-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
      - name: Install the DEB in a clean Ubuntu container
        if: runner.os == 'Linux'
        run: |
          docker run --rm --volume "$PWD/dist:/packages:ro" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o Acquire::Retries=2 update -qq
            apt-get -o Acquire::Retries=2 install -y --no-install-recommends /packages/*.deb
            test -x /opt/privatemusic/bin/PrivateMusic
            test -f /usr/share/applications/privatemusic-PrivateMusic.desktop
            dpkg-query -W privatemusic
          '
      - name: Verify DMG and test its packaged native engine
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          image=$(find dist -name '*.dmg' -type f -print -quit)
          hdiutil verify "$image"
          cd compose
          gradle --no-daemon :composeApp:desktopTest --tests '*NativeEngineSmokeTest*'
      - name: Check Windows clean install and upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'previous-msi'
          gh release download v1.0.1 --repo $env:GITHUB_REPOSITORY --pattern '*_windows-x64.msi' --pattern SHA256SUMS.txt --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $old = Get-ChildItem -LiteralPath $baseline -Filter '*.msi' | Select-Object -First 1
          $new = Get-ChildItem -LiteralPath dist -Filter '*.msi' | Select-Object -First 1
          $pattern = '^([0-9a-f]{64})\s+\*?' + [regex]::Escape($old.Name) + '$'
          $checksum = Get-Content -LiteralPath (Join-Path $baseline 'SHA256SUMS.txt') | Where-Object { $_ -match $pattern } | Select-Object -First 1
          if (-not $checksum -or $checksum -notmatch $pattern -or (Get-FileHash -LiteralPath $old.FullName).Hash -ine $Matches[1]) {
            throw 'Published Windows baseline checksum mismatch.'
          }
          ./scripts/compose-windows-install-test.ps1 -PreviousMsi $old.FullName -CurrentMsi $new.FullName

  android:
    name: Android release APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Android SDK, NDK and Rust target
        run: |
          set -euxo pipefail
          . scripts/android-ci-env.sh
          scripts/android-ci-sdk.sh "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
          rustup target add aarch64-linux-android
      - name: Load optional release signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are incomplete; using a temporary debug signature."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Android release with Rust JNI
        working-directory: compose
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.key.outputs.mode == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.key.outputs.mode == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.key.outputs.mode == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: gradle --no-daemon :androidApp:assembleRelease -Dpm.rust.abi=arm64-v8a
      - name: Sign fallback package and collect APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          MODE: ${{ steps.key.outputs.mode }}
        run: |
          set -euo pipefail
          . scripts/android-ci-env.sh >/dev/null
          mkdir -p dist
          output="dist/PrivateMusic_${VERSION}_android-arm64.apk"
          unsigned="compose/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          if [ -f "$unsigned" ]; then
            [ "$MODE" = "debug" ]
            scripts/android-debug-sign.sh "$unsigned" "$output"
          else
            cp compose/androidApp/build/outputs/apk/release/androidApp-release.apk "$output"
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools/36.0.0" -name apksigner -type f | head -1)"
          "$apksigner" verify --verbose "$output"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt2" dump badging "$output" | grep -q "versionName='$VERSION'"
          "$aapt2" dump badging "$output" | grep -q "package: name='com.dec.privatemusic2.android'"
          unzip -l "$output" | grep -q 'lib/arm64-v8a/libprivate_music_engine.so'
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-v1-android-arm64
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: compose-v1-*
          path: out
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          sha256sum PrivateMusic_* > SHA256SUMS.txt
          cd ..
          notes="docs/releases/${VERSION}.md"
          [ -f "$notes" ]
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Private Music $VERSION" --notes-file "$notes" --latest
