name: Release

# Собирает установщики и публикует их как выпуск GitHub либо из отправленного тега (v0.2.0), либо путем
# запуска рабочего процесса вручную с именем тега: затем тег создается в фиксации, для которой
# предназначен запуск.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must match the version in tauri.conf.json), e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          declared=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ] || [ "$version" != "$cargo_version" ]; then
            echo "Tag $tag, tauri.conf.json $declared, Cargo.toml $cargo_version must agree." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ui:
    name: Release UI checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser test dependencies
        working-directory: ui-tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the complete interface
        working-directory: ui-tests
        run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, bundles: "deb appimage", target: "" }
          - { name: Windows, os: windows-latest, bundles: "nsis", target: "" }
          - { name: macOS, os: macos-latest, bundles: "app dmg", target: "universal-apple-darwin" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        shell: bash
        working-directory: src-tauri
        # В пакет npm входит готовый CLI: никакого десятиминутного `cargo install`.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":true}}' --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Sign desktop updater packages (including DEB)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          find target -type f \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.app.tar.gz' \) -path '*/release/bundle/*' -print0 | while IFS= read -r -d '' file; do
            npx --yes @tauri-apps/cli@2 signer sign --app-version "$VERSION" "$file"
          done

      # Окно входа VK должно загружаться в каждой системе, начиная с реальной сборки.
      - name: Sign-in window loads (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=$(find target -path '*release/bundle/macos/*.app/Contents/MacOS/private-music-desktop' -print -quit)
          [ -n "$binary" ] || binary=target/${{ matrix.target }}/release/private-music-desktop
          scripts/smoke-login.sh "$binary"

      - name: Sign-in window loads (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $env:PM_SMOKE_LOGIN = $report
          $app = Start-Process -FilePath 'target\release\private-music-desktop.exe' -PassThru
          if (-not $app.WaitForExit(150000)) { $app.Kill(); Write-Host 'the app did not finish in time' }
          Write-Host "app exited with $($app.ExitCode)"
          if (Test-Path $report) { Get-Content $report } else { Write-Host '(no report)' }
          $log = Join-Path $env:LOCALAPPDATA 'com.dec.privatemusic2.desktop\logs\private-music.log'
          if (Test-Path $log) { Write-Host "--- $log"; Get-Content $log }
          if (-not ((Test-Path $report) -and (Select-String -Path $report -Pattern '^loaded ' -Quiet))) { exit 1 }

      - name: Fixed window presets and fullscreen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts\smoke-window.ps1 -Binary 'target\release\private-music-desktop.exe'

      # Обновление устанавливается поверх старой версии и должно сохранить данные для входа и данные.
      - name: Installing over the last release keeps the sign-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $new = (Get-ChildItem 'target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1).FullName
          gh release download --repo '${{ github.repository }}' --pattern '*-setup.exe' --dir "$env:RUNNER_TEMP\previous"
          $previous = Get-ChildItem "$env:RUNNER_TEMP\previous\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($previous) { $old = $previous.FullName } else {
            Write-Host '::notice::No earlier release exists: installing the new build over itself instead.'
            $old = $new
          }
          scripts\upgrade-check.ps1 -Old $old -New $new

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.sig
            target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Rust and Android targets
        run: |
          set -euxo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Android SDK, NDK, JDK, environment
        run: |
          set -euxo pipefail
          . scripts/android-ci-env.sh
          scripts/android-ci-sdk.sh "ndk;${NDK_VERSION}" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      # Publish installable APKs only. Keep the signing key in a temporary file.
      - name: Load the release signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            path="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$path"
            chmod 600 "$path"
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "The four signing secrets are set: the APK will be signed by Gradle."
          else
            echo "::error::All four ANDROID signing secrets are required to publish an installable APK."
            exit 1
          fi

      - name: Build release APK (arm64)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/android-build.sh release aarch64 dist

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euxo pipefail
          . scripts/android-ci-env.sh >/dev/null
          scripts/android-verify-apk.sh dist/*.apk arm64-v8a release
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          name="$("$aapt2" dump badging dist/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          [ "$name" = "$VERSION" ] || { echo "APK versionName $name differs from the tag version $VERSION" >&2; exit 1; }
          if ls dist/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Release APK must be signed."
            exit 1
          else
            "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)" verify --verbose dist/*.apk
          fi
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, ui, build, android]
    # Publish only when every platform has built successfully.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download the installers built above
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --pattern 'installers-*' --dir parts
          mkdir -p android-parts
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name android-apk --dir android-parts

      - name: Prepare installers, signatures and update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 scripts/prepare-release.py --parts parts --android android-parts --out out --version "$VERSION" --repo "$REPO"

      - name: Publish the combined release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/release-notes.md"
            printf '%s\n' "Private Music ${TAG#v}: Windows, macOS, Linux and Android." > "$notes"
          fi
          gh release create "$TAG" out/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "Private Music ${TAG#v}" --notes-file "$notes"
