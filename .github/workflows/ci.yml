name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev ffmpeg

      - name: ffmpeg (test fixtures)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg (test fixtures)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Install script
        if: runner.os == 'Linux'
        working-directory: .
        run: bash tests/install-test.sh

  native:
    name: Rust native core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install
        working-directory: ui-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test
        working-directory: ui-tests
        run: npm test

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [check, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, bundles: "deb appimage", target: "" }
          - { name: Windows, os: windows-latest, bundles: "nsis", target: "" }
          - { name: macOS, os: macos-latest, bundles: "dmg", target: "universal-apple-darwin" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        shell: bash
        working-directory: src-tauri
        # The npm package ships a prebuilt CLI: no ten-minute `cargo install`.
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # The VK sign-in window must load on every system, from the real build.
      - name: Sign-in window loads (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=$(find target -path '*release/bundle/macos/*.app/Contents/MacOS/private-music-desktop' -print -quit)
          [ -n "$binary" ] || binary=target/${{ matrix.target }}/release/private-music-desktop
          scripts/smoke-login.sh "$binary"

      - name: Sign-in window loads (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $env:PM_SMOKE_LOGIN = $report
          $app = Start-Process -FilePath 'target\release\private-music-desktop.exe' -PassThru
          if (-not $app.WaitForExit(150000)) { $app.Kill(); Write-Host 'the app did not finish in time' }
          Write-Host "app exited with $($app.ExitCode)"
          if (Test-Path $report) { Get-Content $report } else { Write-Host '(no report)' }
          $log = Join-Path $env:LOCALAPPDATA 'com.dec.privatemusic2.desktop\logs\private-music.log'
          if (Test-Path $log) { Write-Host "--- $log"; Get-Content $log }
          if (-not ((Test-Path $report) -and (Select-String -Path $report -Pattern '^loaded ' -Quiet))) { exit 1 }

      # An update installs over the old version and must keep the sign-in and data.
      - name: Installing over the last release keeps the sign-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $new = (Get-ChildItem 'target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1).FullName
          gh release download --repo '${{ github.repository }}' --pattern '*-setup.exe' --dir "$env:RUNNER_TEMP\previous"
          $previous = Get-ChildItem "$env:RUNNER_TEMP\previous\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($previous) { $old = $previous.FullName } else {
            Write-Host '::notice::No earlier release exists: installing the new build over itself instead.'
            $old = $new
          }
          scripts\upgrade-check.ps1 -Old $old -New $new

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: private-music-desktop-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
