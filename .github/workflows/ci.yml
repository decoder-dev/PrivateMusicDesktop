name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev ffmpeg

      - name: ffmpeg (test fixtures)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg (test fixtures)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  native:
    name: Rust native core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install
        working-directory: ui-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test
        working-directory: ui-tests
        run: npm test

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [check, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: private-music-desktop-${{ runner.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: warn
