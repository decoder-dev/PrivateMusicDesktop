name: GLib runner diagnosis

on:
  # Branch pushes are already validated by pull_request; avoid building the same commit twice.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  glib-security:
    name: GLib memory-safety regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GLib headers
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Exercise upstream iterators under optimization
        env:
          RUST_BACKTRACE: full
        run: |
          rustc -Vv
          cargo -V
          printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS:-}"
          cargo test --manifest-path vendor/glib/Cargo.toml --release --locked --lib -- --nocapture --test-threads=1
