name: GLib runner diagnosis

on:
  # Branch pushes are already validated by pull_request; avoid building the same commit twice.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  glib-security:
    name: GLib memory-safety regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GLib headers
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Exercise upstream iterators under optimization
        env:
          RUST_BACKTRACE: full
        run: |
          rustc -Vv
          cargo -V
          printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS:-}"
          cargo test --manifest-path vendor/glib/Cargo.toml --release --locked --lib --no-run
          python3 - <<'DIAG'
          import os, subprocess
          base = ["cargo", "test", "--manifest-path", "vendor/glib/Cargo.toml", "--release", "--locked", "--lib", "--"]
          for backtrace, capture, threads in [("0", True, 4), ("full", True, 4), ("0", False, 4), ("full", False, 4), ("0", True, 1)]:
              for attempt in range(3):
                  env = dict(os.environ, RUST_BACKTRACE=backtrace)
                  args = base + ["--test-threads=" + str(threads)] + ([] if capture else ["--nocapture"])
                  result = subprocess.run(args, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(f"CASE backtrace={backtrace} capture={capture} threads={threads} attempt={attempt} exit={result.returncode}", flush=True)
                  print("\n".join(result.stdout.splitlines()[-12:]), flush=True)
          DIAG
