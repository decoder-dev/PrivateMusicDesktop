name: Service canary
# Daily check of everything the app depends on that needs no account: VK API shape, lyrics service,
# and the published installers. A red run can surface outages before users report them.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check external services and release installers
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          failures = []
          def fetch(url, probe=False):
              # Asset storage may reject HEAD. Read one byte even if it ignores Range.
              headers = {"User-Agent": "private-music-canary"}
              if probe:
                  headers["Range"] = "bytes=0-0"
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.read(1) if probe else response.read()
              except urllib.error.HTTPError as error:
                  return error.code, b""
              except (urllib.error.URLError, TimeoutError) as error:
                  return None, str(error).encode()
          def check(name, ok, detail=""):
              print(("ok   " if ok else "FAIL ") + name + (f" — {detail}" if detail and not ok else ""))
              if not ok: failures.append(name)

          # VK answers an unauthenticated method call with a JSON error object: the endpoint and its shape are alive.
          status, body = fetch("https://api.vk.ru/method/audio.get?v=5.131")
          try:
              payload = json.loads(body)
              check("VK API answers with an error object", isinstance(payload.get("error", {}).get("error_code"), int), body[:200])
          except Exception as error:
              check("VK API answers with JSON", False, str(error))

          status, body = fetch("https://lrclib.net/api/search?q=hello")
          try:
              check("LRCLIB search returns a list", status == 200 and isinstance(json.loads(body), list), f"status {status}")
          except Exception as error:
              check("LRCLIB search returns JSON", False, str(error))

          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/latest/download/"
          status, body = fetch(base + "SHA256SUMS.txt")
          check("SHA256SUMS.txt is published", status == 200, f"status {status}")
          if status == 200:
              expected = {
                  "windows-x64.msi", "linux-amd64.deb", "macos-arm64.dmg",
                  "macos-x64.dmg", "android-arm64.apk",
              }
              packages = {}
              for line in body.decode("utf-8", errors="replace").splitlines():
                  entry = re.fullmatch(r"[0-9a-fA-F]{64}\s+\*?(PrivateMusic_(\d+\.\d+\.\d+)_(\S+))", line)
                  if entry:
                      name, version, target = entry.groups()
                      packages.setdefault(version, {})[target] = name
              check("checksums cover all installers for one version",
                    len(packages) == 1 and expected <= set(next(iter(packages.values()))),
                    str({version: sorted(targets) for version, targets in packages.items()}))
              if len(packages) == 1:
                  for target, name in sorted(next(iter(packages.values())).items()):
                      if target in expected:
                          code, first_byte = fetch(base + name, probe=True)
                          check(f"{target} installer is downloadable", code in (200, 206) and bool(first_byte), f"status {code}")
          if failures:
              print("\nFailed checks:", *failures, sep="\n  ")
              sys.exit(1)
          PY
