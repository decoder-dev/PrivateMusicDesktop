version: 2
updates:
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Europe/Moscow
  open-pull-requests-limit: 3
  groups:
    security-fixes:
      applies-to: security-updates
      patterns:
      - '*'
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: cargo
